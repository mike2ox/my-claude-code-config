# my-memo 기본 Vault 경로. Vault가 이동하면 이 값만 바꾸면 된다.
# 개별 실행에서만 다른 경로를 쓰려면 SKILL.md 설명대로 `--vault <경로>`를 인자로 넘긴다.
#
# 주의: 실제 디스크상의 대소문자와 정확히 일치시킬 것.
# macOS(APFS)는 대소문자를 구분하지 않아 표기가 달라도 파일 쓰기는 성공하지만,
# Obsidian 동기화(osync)는 경로를 대소문자까지 구분해 인덱싱한다. 표기가 갈리면
# 같은 파일이 두 경로로 중복 등록되어 "vault deletion detected" 오탐이 발생한다.
VAULT_ROOT=/Volumes/860QVO/Obsidian/davinci-note/Career/Clebrain
